  <script>
    (() => {
      try {
        const saved = localStorage.getItem('connect-theme') || localStorage.getItem('theme');
        const dark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved
          : (dark ? 'dark' : 'light');
      } catch {
        document.documentElement.dataset.theme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    })();
  </script>

  <script>
    window.__connectInitialLoadBootError = function() {
      var gate = document.getElementById('initial-load-gate');
      if (!gate || gate.dataset.status !== 'loading') return false;
      gate.dataset.status = 'error';
      gate.dataset.errorCode = 'BOOT_ERROR';
      gate.setAttribute('aria-busy', 'false');
      var status = gate.querySelector('.initial-load-message');
      var error = gate.querySelector('.initial-load-error');
      var retry = gate.querySelector('.initial-load-retry');
      if (status) status.textContent = '読み込みに失敗しました';
      if (error) { error.hidden = false; error.textContent = 'アプリを読み込めませんでした。'; }
      if (retry) { retry.hidden = false; retry.onclick = function() { window.location.reload(); }; }
      console.error('[ConnectStartup] Boot error', { errorType: 'application' });
      return true;
    };
    window.onerror = function() {
      if (window.__connectInitialLoadBootError()) return true;
      var app = document.getElementById('app');
      if (app) app.innerHTML = '<div style="padding:20px;color:red"><h3>読み込みに失敗しました</h3><p>予期しないエラーが発生しました。ページを再読み込みしてください。</p></div>';
      console.error('[ConnectStartup] Unhandled browser error', { errorType: 'application' });
      return true;
    };
    window.addEventListener('unhandledrejection', function(event) {
      if (window.__connectInitialLoadBootError()) {
        event.preventDefault();
        return;
      }
      var app = document.getElementById('app');
      if (app) app.innerHTML = '<div style="padding:20px;color:red"><h3>読み込みに失敗しました</h3><p>予期しない非同期エラーが発生しました。ページを再読み込みしてください。</p></div>';
      console.error('[ConnectStartup] Unhandled promise rejection', { errorType: 'application' });
    });
  </script>
